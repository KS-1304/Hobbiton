<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kingshot World Map</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .myDivIcon {
            text-align: center;
            /* Horizontally center the text (icon) */
            line-height: 40px;
            /* Vertically center the text (icon) */
            border-radius: 100%;
            box-sizing: border-box;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }

        .sanctuary {
            color: grey;
        }

        .castle {
            color: gold;
        }

        .fortress {
            color: gold;
        }

        .leaflet-control-rotate {
            visibility: hidden;
        }

        .leaflet-tooltip {
            background-color: transparent;
            border: 0px;
            box-shadow: none;
        }

        .info {
            padding: 6px 8px;
            font: 16px/18px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }

        /* Coloured disc inside each marker; colours are set inline from alliances.js */
        .marker-fill {
            width: 100%;
            height: 100%;
            border-radius: 100%;
            box-sizing: border-box;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: Arial, sans-serif;
            max-width: 300px;
            max-height: 40vh;
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-box {
            width: 30px;
            height: 20px;
            flex: none;
        }

        /* "View as": outposts the selected alliance touches and already holds */
        .touching-glow {
            box-shadow: 0 0 12px 10px white !important;
            z-index: 1000 !important;
        }

        /* "View as": outposts the selected alliance touches but does not hold */
        .open-glow {
            box-shadow: 0 0 0 4px #39ff14, 0 0 12px 8px rgba(57, 255, 20, 0.9);
            z-index: 1001 !important;
            animation: open-pulse 1.6s ease-in-out infinite;
        }

        @keyframes open-pulse {
            0%, 100% {
                box-shadow: 0 0 0 4px #39ff14, 0 0 10px 6px rgba(57, 255, 20, 0.9);
            }
            50% {
                box-shadow: 0 0 0 4px #39ff14, 0 0 20px 12px rgba(57, 255, 20, 0.45);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .open-glow {
                animation: none;
            }
        }

        /* "View as": everything else */
        .view-dim {
            opacity: 0.35;
        }

        .view-picker {
            font-family: Arial, sans-serif;
            max-width: 220px;
        }

        .view-picker label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .view-picker select {
            font-size: 16px;
            max-width: 100%;
        }

        .view-key {
            margin-top: 6px;
            font-size: 13px;
            line-height: 20px;
        }

        .key-swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 0 8px 0 4px;
            vertical-align: middle;
            background: #888;
        }

        .key-owned {
            box-shadow: 0 0 0 3px white, 0 0 0 4px #999;
        }

        .key-open {
            box-shadow: 0 0 0 3px #39ff14;
        }

        .tag-chip {
            display: inline-block;
            padding: 0 5px;
            margin: 1px 2px 1px 0;
            border-radius: 3px;
            font-size: 13px;
            line-height: 18px;
        }

        /* Modal styles for editing owner */
        .owner-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .owner-modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .owner-modal h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .owner-modal label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .owner-modal input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .owner-modal .feature-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }

        .owner-modal .touching-help {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }

        .owner-modal .touching-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .owner-modal .touching-list label {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .owner-modal .touching-list input[type="checkbox"] {
            width: auto;
            margin: 0;
            padding: 0;
        }

        .owner-modal .touching-empty {
            font-size: 13px;
            color: #999;
        }

        .owner-modal .touching-add {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .owner-modal .touching-add input {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        .owner-modal .touching-add button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            background: #e0e0e0;
            color: #333;
        }

        .owner-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .owner-modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .owner-modal-buttons .cancel-btn {
            background: #e0e0e0;
            color: #333;
        }

        .owner-modal-buttons .cancel-btn:hover {
            background: #d0d0d0;
        }

        .owner-modal-buttons .save-btn {
            background: #4CAF50;
            color: white;
        }

        .owner-modal-buttons .save-btn:hover {
            background: #45a049;
        }

        .leaflet-panel-layers-list {
            height: auto !important;
            overflow-y: auto !important;
        }
    </style>

    <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aazuspan/leaflet-feature-legend/src/feature-legend.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/aazuspan/leaflet-feature-legend/src/feature-legend.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-panel-layers@1.3.1/dist/leaflet-panel-layers.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/leaflet-panel-layers@1.3.1/dist/leaflet-panel-layers.min.css"
        rel="stylesheet">
    <script src="alliances.js"></script>


</head>

<body>
    <div id="map"></div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);

        // "View as" alliance (case-sensitive tag, '' = none). Can be preset with ?view=TAG
        var viewAs = urlParams.get('view') || '';

        // set default zoom level and center point
        var coords = [600, 600];
        var zoomLevel = 0;
        var bounds = [[0, 0], [1200, 1200]];

        // Declare map & Rotate it

        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            rotate: true,
            rotateControl: {
                closeOnZeroBearing: false,
                // position: 'bottomleft',
            },
            bearing: -45,
            zoomControl: false

        }).setView(coords, zoomLevel);

        //L.control.zoom({ position: 'bottomleft' }).addTo(map);


        // Declare featuregroup layers, overlay map and icon > featuregroup layer.

        var armoryLayer = L.featureGroup().addTo(map);
        var arsenalLayer = L.featureGroup().addTo(map);
        var buildersLayer = L.featureGroup().addTo(map);
        var castleLayer = L.featureGroup().addTo(map);
        var drillLayer = L.featureGroup().addTo(map);
        var foragersLayer = L.featureGroup().addTo(map);
        var fortressLayer = L.featureGroup().addTo(map);
        var harvestLayer = L.featureGroup().addTo(map);
        var lodgeLayer = L.featureGroup().addTo(map);
        var sanctuaryLayer = L.featureGroup().addTo(map);
        var scholarsLayer = L.featureGroup().addTo(map);

        var baseMaps = {};

        var overlays = {
            "Armory": armoryLayer,
            "Arsenal": arsenalLayer,
            "Builder's Guild": buildersLayer,
            "Castle": castleLayer,
            "Drill Camp": drillLayer,
            "Forager's Grove": foragersLayer,
            "Fortress": fortressLayer,
            "Frontier Lodge": lodgeLayer,
            "Harvest Altar": harvestLayer,
            "Sanctuary": sanctuaryLayer,
            "Scholar's Tower": scholarsLayer
        }

        var layersmap = {
            "armory": armoryLayer,
            "arsenal": arsenalLayer,
            "builders": buildersLayer,
            "castle": castleLayer,
            "drill": drillLayer,
            "foragers": foragersLayer,
            "fortress": fortressLayer,
            "lodge": lodgeLayer,
            "harvest": harvestLayer,
            "sanctuary": sanctuaryLayer,
            "scholars": scholarsLayer
        }


        // BASE MAP DRAWING
        // Draw outer bounds.
        var polygon = L.polygon([
            [0, -0],
            [0, 1200],
            [1200, 1200],
            [1200, 0]
        ], { color: 'green' }).addTo(map);

        // Draw plains boundary
        var polygon = L.polygon([
            [300, 300],
            [300, 899],
            [899, 899],
            [899, 300]
        ], { color: 'green' }).addTo(map);

        // Draw fertile land
        var polygon = L.polygon([
            [450, 450],
            [450, 749],
            [749, 749],
            [749, 450]
        ], { color: 'greenyellow' }).addTo(map);

        // Declare helper functions for updating the info pane.
        function highlightFeature(e) {
            var layer = e.target;
            info.update(layer.feature.properties, layer.feature.geometry);
        }

        function resetHighlight(e) {
            info.update();
        }

        // Declare icon defs and mapping.

        var iconmap = {
            "armory": '<span class="mdi mdi-24px mdi-shield-cross"></span>',
            "arsenal": '<span class="mdi mdi-24px mdi-shield-sword"></span>',
            "builders": '<span class="mdi mdi-24px mdi-hard-hat"></span>',
            "castle": '<span class="mdi mdi-48px mdi-castle"></span>',
            "drill": '<span class="mdi mdi-24px mdi-train"></span>',
            "foragers": '<span class="mdi mdi-24px mdi-cart"></span>',
            "fortress": '<span class="mdi mdi-36px mdi-chess-rook"></span>',
            "lodge": '<span class="mdi mdi-24px mdi-greenhouse"></span>',
            "harvest": '<span class="mdi mdi-24px mdi-barley"></span>',
            "sanctuary": '<span class="mdi mdi-36px mdi-shield-crown"></span>',
            "scholars": '<span class="mdi mdi-24px mdi-bookshelf"></span>'
        }

        // Sanctuaries, Fortresses and the King's Castle don't use territory adjacency ("touching").
        var NO_TOUCHING_ICONS = ['sanctuary', 'fortress', 'castle'];

        function usesTouching(props) {
            return !!props && NO_TOUCHING_ICONS.indexOf(props.icon) === -1;
        }

        // Alliance tags whose territory touches this outpost (case-sensitive).
        function getTouching(props) {
            return props && Array.isArray(props.touching) ? props.touching : [];
        }

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Case-insensitive alphabetical order, ties broken case-sensitively (so "LGN" and "LgN" stay separate).
        function compareTags(a, b) {
            var la = a.toLowerCase(), lb = b.toLowerCase();
            if (la !== lb) return la < lb ? -1 : 1;
            return a < b ? -1 : (a > b ? 1 : 0);
        }

        function sameTagSet(a, b) {
            if (a.length !== b.length) return false;
            for (var i = 0; i < a.length; i++) {
                if (b.indexOf(a[i]) === -1) return false;
            }
            return true;
        }

        // How the selected "View as" alliance relates to this feature: 'held', 'open', 'own' or ''.
        function viewState(props) {
            if (!viewAs) return '';
            if (usesTouching(props) && getTouching(props).indexOf(viewAs) !== -1) {
                return props.OWNER === viewAs ? 'held' : 'open';
            }
            return props.OWNER === viewAs ? 'own' : '';
        }

        function makeIcon(feature) {
            var props = feature.properties;
            var extraClass = '';
            if (viewAs) {
                var state = viewState(props);
                if (state === 'held') extraClass = ' touching-glow';
                else if (state === 'open') extraClass = ' open-glow';
                else if (state === '') extraClass = ' view-dim';
            }
            return L.divIcon({
                html: '<div class="marker-fill" style="' + allianceCss(props.OWNER) + '">' + (iconmap[props.icon] || '') + '</div>',
                iconSize: [42, 42],
                iconAnchor: [21, 21],
                className: 'myDivIcon' + extraClass
            });
        }

        // Tooltip content is built when the tooltip opens, so it always reflects edits and the "View as" choice.
        function tooltipContent(layer) {
            var props = layer.feature.properties;
            var coordsXY = layer.feature.geometry.coordinates;
            var html = escapeHtml(props.Type) + ' L' + escapeHtml(props.level) + '</br>X:' + coordsXY[0] + ' Y:' + coordsXY[1] + '</br>Buff: ' + escapeHtml(props.buff) + '<br />Held By:' + escapeHtml(props.OWNER);
            if (usesTouching(props)) {
                var touching = getTouching(props);
                if (touching.length) {
                    html += '<br />Touching: ' + touching.map(escapeHtml).join(', ');
                }
                if (viewState(props) === 'open') {
                    html += '<br /><b>Open to take for ' + escapeHtml(viewAs) + '</b>';
                }
            }
            return html;
        }

        function updateLayerDisplay(feature, layer) {
            layer.setIcon(makeIcon(feature));
            // Re-render the tooltip if it is currently open.
            layer.setTooltipContent(tooltipContent);
        }

        function showOwnerEditModal(feature, layer) {
            var props = feature.properties;
            var hasTouching = usesTouching(props);

            // Create modal overlay
            var overlay = document.createElement('div');
            overlay.className = 'owner-modal-overlay';

            var modal = document.createElement('div');
            modal.className = 'owner-modal';

            modal.innerHTML = `
        <h3>Edit Owner</h3>
        <div class="feature-info">
          <strong>${escapeHtml(props.Type)}</strong> Level ${escapeHtml(props.level)}<br>
          Location: X${feature.geometry.coordinates[0]}, Y${feature.geometry.coordinates[1]}<br>
          Buff: ${escapeHtml(props.buff)}
        </div>
        <label for="owner-input">Owner:</label>
        <input type="text" id="owner-input" maxlength="10" autocomplete="off" autofocus>
        ${hasTouching ? `
        <label>Touching alliances:</label>
        <div class="touching-help">Alliances whose territory borders this outpost.</div>
        <div class="touching-list"></div>
        <div class="touching-add">
          <input type="text" id="touching-add-input" maxlength="10" placeholder="Add alliance tag" autocomplete="off">
          <button type="button" class="add-btn">Add</button>
        </div>
        ` : ''}
        <div class="owner-modal-buttons">
          <button class="cancel-btn">Cancel</button>
          <button class="save-btn">Save</button>
        </div>
      `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            var input = modal.querySelector('#owner-input');
            var cancelBtn = modal.querySelector('.cancel-btn');
            var saveBtn = modal.querySelector('.save-btn');
            var touchingList = modal.querySelector('.touching-list');
            var addInput = modal.querySelector('#touching-add-input');
            var addBtn = modal.querySelector('.add-btn');

            input.value = props.OWNER === undefined || props.OWNER === null ? '' : props.OWNER;

            // Touching checkboxes: every alliance in the data, plus anything already on this outpost.
            function findCheckbox(tag) {
                var boxes = touchingList.querySelectorAll('input[type="checkbox"]');
                for (var i = 0; i < boxes.length; i++) {
                    if (boxes[i].value === tag) return boxes[i];
                }
                return null;
            }

            function addCheckbox(tag, checked) {
                var empty = touchingList.querySelector('.touching-empty');
                if (empty) touchingList.removeChild(empty);

                var label = document.createElement('label');
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = tag;
                cb.checked = checked;
                var chip = document.createElement('span');
                chip.className = 'tag-chip';
                chip.setAttribute('style', allianceCss(tag) + ' border: none;');
                chip.textContent = tag;
                label.appendChild(cb);
                label.appendChild(chip);
                touchingList.appendChild(label);
                return cb;
            }

            function addTagFromInput() {
                var tag = addInput.value.trim();
                if (!tag) return;
                var cb = findCheckbox(tag);
                if (cb) {
                    cb.checked = true;
                } else {
                    addCheckbox(tag, true);
                }
                addInput.value = '';
            }

            if (hasTouching) {
                var current = getTouching(props);
                var tags = knownAlliances.slice();
                current.forEach(function (tag) {
                    if (tags.indexOf(tag) === -1) tags.push(tag);
                });
                tags.sort(compareTags);
                if (tags.length) {
                    tags.forEach(function (tag) {
                        addCheckbox(tag, current.indexOf(tag) !== -1);
                    });
                } else {
                    var empty = document.createElement('div');
                    empty.className = 'touching-empty';
                    empty.textContent = 'No alliances yet - add a tag below.';
                    touchingList.appendChild(empty);
                }

                addBtn.addEventListener('click', addTagFromInput);
                addInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addTagFromInput();
                    } else if (e.key === 'Escape') {
                        closeModal();
                    }
                });
            }

            // Focus and select input
            setTimeout(function () {
                input.focus();
                input.select();
            }, 50);

            // Close modal function
            function closeModal() {
                if (overlay.parentNode) {
                    overlay.parentNode.removeChild(overlay);
                }
            }

            // Save function
            function saveOwner() {
                var newOwner = input.value.trim();

                var changed = false;

                if (newOwner && newOwner !== props.OWNER) {
                    props.OWNER = newOwner;
                    changed = true;
                }

                if (hasTouching) {
                    // A tag typed but not yet added still counts.
                    if (addInput.value.trim()) {
                        addTagFromInput();
                    }
                    var newTouching = [];
                    var boxes = touchingList.querySelectorAll('input[type="checkbox"]');
                    for (var i = 0; i < boxes.length; i++) {
                        if (boxes[i].checked && newTouching.indexOf(boxes[i].value) === -1) {
                            newTouching.push(boxes[i].value);
                        }
                    }
                    newTouching.sort(compareTags);
                    if (!Array.isArray(props.touching) || !sameTagSet(newTouching, props.touching)) {
                        props.touching = newTouching;
                        changed = true;
                    }
                }

                if (changed) {
                    updateLayerDisplay(feature, layer);
                    refreshAllianceControls();
                    // Update info pane if visible
                    info.update(props, feature.geometry);
                }
                closeModal();
            }

            // Event listeners
            cancelBtn.addEventListener('click', closeModal);
            saveBtn.addEventListener('click', saveOwner);

            // Close on overlay click
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) {
                    closeModal();
                }
            });

            // Handle Enter and Escape keys
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    saveOwner();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            });

            // Prevent map interactions while modal is open
            L.DomEvent.disableClickPropagation(overlay);
        }

        // Every marker layer, so the "View as" choice can restyle them all.
        var featureLayers = [];

        function onEachFeature(feature, layer) {
            if (feature.properties && feature.properties.Type) {
                layer.setIcon(makeIcon(feature));
                layer.bindTooltip(tooltipContent);
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: function () {
                        showOwnerEditModal(feature, layer);
                    }
                });
                if (layersmap[feature.properties.icon]) {
                    layersmap[feature.properties.icon].addLayer(layer);
                }
                featureLayers.push(layer);
            }
        }

        // ALLIANCES PRESENT IN THE LOADED DATA (legend, "View as" picker, edit modal)

        // Alliances holding at least one feature (legend).
        var ownerAlliances = [];
        // Owners plus every tag found in a touching list (picker and edit modal).
        var knownAlliances = [];

        function collectAlliances() {
            var owners = Object.create(null);
            var known = Object.create(null);
            var features = (geojsonFeature && geojsonFeature.features) || [];
            features.forEach(function (f) {
                var props = f.properties;
                if (!props) return;
                if (isAllianceTag(props.OWNER)) {
                    owners[props.OWNER] = true;
                    known[props.OWNER] = true;
                }
                if (usesTouching(props)) {
                    getTouching(props).forEach(function (tag) {
                        if (isAllianceTag(tag)) known[tag] = true;
                    });
                }
            });
            ownerAlliances = Object.keys(owners).sort(compareTags);
            knownAlliances = Object.keys(known).sort(compareTags);
        }

        function refreshAllianceControls() {
            collectAlliances();
            legend.render();
            viewPicker.render();
        }

        function setViewAs(tag) {
            viewAs = tag || '';
            featureLayers.forEach(function (layer) {
                updateLayerDisplay(layer.feature, layer);
            });
            viewPicker.render();

            // Keep the choice in the URL so the view can be shared.
            var url = new URL(window.location);
            if (viewAs) {
                url.searchParams.set('view', viewAs);
            } else {
                url.searchParams.delete('view');
            }
            window.history.replaceState({}, '', url);
        }


        // Declare geojson features.

        var geojsonFeature;

        var archive = urlParams.get('archive');
        var dataFile = archive ? `data-${archive}.json` : 'data.json';

        // Import features to map from external file.
        fetch(dataFile)
            .then(response => response.json())
            .then(data => {
                geojsonFeature = data;
                L.geoJSON(geojsonFeature, {
                    onEachFeature: onEachFeature
                }).addTo(map);
                // Legend and "View as" picker come from the loaded data.
                refreshAllianceControls();
            })
            .catch(error => {
                console.error('Error loading GeoJSON data:', error);
                alert('Could not load map data from ' + dataFile + '. Please ensure the file exists.');
            });


        // Custom Leaflet Controls for Home and Export
        L.Control.Navigation = L.Control.extend({
            onAdd: function (map) {
                var container = L.DomUtil.create('div', 'leaflet-control');
                container.style.display = 'flex';
                container.style.flexDirection = 'column';
                container.style.gap = '4px';
                container.style.border = 'none';
                container.style.background = 'transparent';
                container.style.width = 'auto';

                // Home Button
                var homeBtn = L.DomUtil.create('a', '', container);
                homeBtn.href = '../';
                homeBtn.title = 'Home';
                homeBtn.innerHTML = '<span class="mdi mdi-home"></span> Return Home';
                homeBtn.style.padding = '0 8px';
                homeBtn.style.height = '30px';
                homeBtn.style.lineHeight = '30px';
                homeBtn.style.display = 'flex';
                homeBtn.style.alignItems = 'center';
                homeBtn.style.gap = '6px';
                homeBtn.style.background = 'white';
                homeBtn.style.color = 'black';
                homeBtn.style.textDecoration = 'none';
                homeBtn.style.border = '1px solid #ccc';
                homeBtn.style.borderRadius = '4px';
                homeBtn.style.fontFamily = 'Arial, sans-serif';
                homeBtn.style.fontSize = '12px';
                homeBtn.style.fontWeight = 'bold';
                homeBtn.style.whiteSpace = 'nowrap';

                // Export Button
                var exportBtn = L.DomUtil.create('a', '', container);
                exportBtn.href = '#';
                exportBtn.title = 'Export GeoJSON';
                exportBtn.innerHTML = '<span class="mdi mdi-download"></span> Export GeoJSON';
                exportBtn.style.padding = '0 8px';
                exportBtn.style.height = '30px';
                exportBtn.style.lineHeight = '30px';
                exportBtn.style.display = 'flex';
                exportBtn.style.alignItems = 'center';
                exportBtn.style.gap = '6px';
                exportBtn.style.background = 'white';
                exportBtn.style.color = 'black';
                exportBtn.style.textDecoration = 'none';
                exportBtn.style.border = '1px solid #ccc';
                exportBtn.style.borderRadius = '4px';
                exportBtn.style.fontFamily = 'Arial, sans-serif';
                exportBtn.style.fontSize = '12px';
                exportBtn.style.fontWeight = 'bold';
                exportBtn.style.whiteSpace = 'nowrap';

                L.DomEvent.on(exportBtn, 'click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    L.DomEvent.preventDefault(e);
                    exportGeoJSON();
                });

                return container;
            }
        });

        map.addControl(new L.Control.Navigation({ position: 'topleft' }));

        // Create legend + Layer Control
        var overLayers = [

            {
                group: "Outposts",
                collapsed: false,
                layers: [
                    {
                        name: "Armory",
                        icon: '<span class="mdi mdi-16px mdi-shield-cross">',
                        layer: armoryLayer
                    },
                    {
                        name: "Arsenal",
                        icon: '<span class="mdi mdi-shield-sword"></span>',
                        layer: arsenalLayer
                    },
                    {
                        name: "Builder's Guild",
                        icon: '<span class="mdi mdi-hard-hat"></span>',
                        layer: buildersLayer
                    },
                    {
                        name: "Drill Camp",
                        icon: '<span class="mdi mdi-train"></span>',
                        layer: drillLayer
                    },
                    {
                        name: "Forager's Grove",
                        icon: '<span class="mdi mdi-cart"></span>',
                        layer: foragersLayer
                    },
                    {
                        name: "Frontier Lodge",
                        icon: '<span class="mdi mdi-greenhouse"></span>',
                        layer: lodgeLayer
                    },
                    {
                        name: "Harvest Altar",
                        icon: '<span class="mdi mdi-barley"></span>',
                        layer: harvestLayer
                    },
                    {
                        name: "Scholar's Tower",
                        icon: '<span class="mdi mdi-bookshelf"></span>',
                        layer: scholarsLayer
                    },
                    {
                        name: "Fortress",
                        icon: '<span class="mdi mdi-chess-rook"></span>',
                        layer: fortressLayer
                    },
                    {
                        name: "Sanctuary",
                        icon: '<span class="mdi mdi-shield-crown"></span>',
                        layer: sanctuaryLayer
                    }
                ]
            }
        ];
        map.addControl(new L.Control.PanelLayers(baseMaps, overLayers, { position: 'topleft', collapsibleGroups: true }));



        // Create Info Pane.
        var info = L.control();

        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info'); // create a div with a class "info"
            this.update();
            return this._div;
        };

        // method that we will use to update the control based on feature properties passed
        info.update = function (props, coords, isTemp = false) {
            let content = '<h4>Outpost Details</h4>';
            if (props) {
                content += escapeHtml(props.Type) + ' L' + escapeHtml(props.level) + '</br>X' + coords.coordinates[0] + ',Y' + coords.coordinates[1] + '<br />Buff: ' + escapeHtml(props.buff) + '<br />Held By:' + escapeHtml(props.OWNER);
                if (usesTouching(props)) {
                    var touching = getTouching(props);
                    content += '<br />Touching: ';
                    if (touching.length) {
                        content += touching.map(function (tag) {
                            return '<span class="tag-chip" style="' + allianceCss(tag) + ' border: none;">' + escapeHtml(tag) + '</span>';
                        }).join('');
                    } else {
                        content += 'none';
                    }
                    if (viewState(props) === 'open') {
                        content += '<br /><b>Open to take for ' + escapeHtml(viewAs) + '</b>';
                    }
                }
            } else if (isTemp) {
                content = '<h4>Temporary Location</h4>';
                const x = coords[0];
                const y = coords[1];
                content += `Coord: X${x}, Y${y}<br><br>`;
                content += `<button onclick="copyShareLink(${x}, ${y})" style="background: #4CAF50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 5px; width: 100%;">Copy Share Link</button>`;
                content += `<button onclick="clearTempMarker()" style="background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%;">Clear Marker</button>`;
            } else {
                content += 'Hover over an outpost or click map to drop pin';
            }
            this._div.innerHTML = content;
        };

        info.addTo(map);
        // Create legend for owners: every alliance holding at least one feature in the loaded data.
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info legend');
            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
            this.render();
            return this._div;
        };

        legend.render = function () {
            if (!this._div) return;
            var div = this._div;
            div.innerHTML = '';
            ownerAlliances.forEach(function (tag) {
                var item = L.DomUtil.create('div', 'legend-item', div);
                var box = L.DomUtil.create('div', 'legend-box', item);
                box.setAttribute('style', allianceCss(tag));
                item.appendChild(document.createTextNode(tag));
            });
            div.style.display = ownerAlliances.length ? '' : 'none';
        };

        legend.addTo(map);

        // "View as" picker: highlights the outposts an alliance's territory touches.
        var viewPicker = L.control({ position: 'bottomleft' });
        viewPicker.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info view-picker');
            var label = L.DomUtil.create('label', '', div);
            label.htmlFor = 'view-as-select';
            label.textContent = 'View as';
            var select = L.DomUtil.create('select', '', div);
            select.id = 'view-as-select';
            this._key = L.DomUtil.create('div', 'view-key', div);
            this._select = select;
            this._div = div;

            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            L.DomEvent.on(select, 'change', function () {
                setViewAs(select.value);
            });

            this.render();
            return div;
        };

        viewPicker.render = function () {
            if (!this._div) return;
            var select = this._select;

            var tags = knownAlliances.slice();
            if (viewAs && tags.indexOf(viewAs) === -1) {
                tags.push(viewAs);
                tags.sort(compareTags);
            }

            select.innerHTML = '';
            var none = document.createElement('option');
            none.value = '';
            none.textContent = '(none)';
            select.appendChild(none);
            tags.forEach(function (tag) {
                var option = document.createElement('option');
                option.value = tag;
                option.textContent = tag;
                select.appendChild(option);
            });
            select.value = viewAs;

            var key = this._key;
            if (viewAs) {
                var held = 0, open = 0;
                featureLayers.forEach(function (layer) {
                    var state = viewState(layer.feature.properties);
                    if (state === 'held') held++;
                    else if (state === 'open') open++;
                });
                key.innerHTML = '<div><span class="key-swatch key-owned"></span>Touching, held (' + held + ')</div>' +
                    '<div><span class="key-swatch key-open"></span>Open to take (' + open + ')</div>';
                key.style.display = '';
            } else {
                key.innerHTML = '';
                key.style.display = 'none';
            }
        };

        viewPicker.addTo(map);

        // Export function
        function exportGeoJSON() {
            const dataStr = JSON.stringify(geojsonFeature, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

            const exportFileDefaultName = 'map_data_updated.json';

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        // TEMPORARY MARKER & SHARING LOGIC
        var tempMarker;

        function setTempMarker(x, y, updateUrl = true) {
            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            tempMarker = L.marker([y, x], {
                icon: L.divIcon({
                    html: '<span class="mdi mdi-36px mdi-map-marker" style="color: #4CAF50; text-shadow: 0 0 10px white;"></span>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    className: 'temp-marker-icon'
                })
            }).addTo(map);

            info.update(null, [x, y], true);

            if (updateUrl) {
                const url = new URL(window.location);
                url.searchParams.set('tx', x);
                url.searchParams.set('ty', y);
                window.history.replaceState({}, '', url);
            }
        }

        function clearTempMarker() {
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
            }
            const url = new URL(window.location);
            url.searchParams.delete('tx');
            url.searchParams.delete('ty');
            window.history.replaceState({}, '', url);
            info.update();
        }

        function copyShareLink(x, y) {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Share link copied to clipboard!');
            });
        }

        map.on('click', function (e) {
            // Convert clicked latlng to integer coords (X, Y)
            const x = Math.round(e.latlng.lng);
            const y = Math.round(e.latlng.lat);

            // Only set if within map bounds
            if (x >= 0 && x <= 1200 && y >= 0 && y <= 1200) {
                setTempMarker(x, y);
            }
        });

        // Load from URL params on startup
        window.addEventListener('load', function () {
            const params = new URLSearchParams(window.location.search);
            const tx = params.get('tx');
            const ty = params.get('ty');
            if (tx !== null && ty !== null) {
                setTempMarker(parseInt(tx), parseInt(ty), false);
                // Pan to the marker
                map.panTo([parseInt(ty), parseInt(tx)]);
            }
        });

    </script>
</body>

</html>
